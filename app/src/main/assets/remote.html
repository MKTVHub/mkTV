<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15121d">
<meta name="referrer" content="no-referrer">
<title>mkTV Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="g" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0" stop-color="#7C3AED"/%3E%3Cstop offset=".55" stop-color="#DB2777"/%3E%3Cstop offset="1" stop-color="#F97316"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="15" fill="url%28#g%29"/%3E%3Cpath d="M22 15v34l29-17z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/%3E%3Ctext x="31" y="37" text-anchor="middle" font-size="13" font-weight="800" font-family="system-ui,sans-serif" fill="#DB2777"%3Emk%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#15121D">
<style>
  :root { --bg:#15121d; --card:#221d2e; --key:#2d2640; --key2:#3a3152; --text:#f4f2f8; --muted:#a39db3;
          --accent1:#7c3aed; --accent2:#db2777; --accent3:#f97316; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,Roboto,sans-serif; }
  body { padding:16px 18px calc(24px + env(safe-area-inset-bottom)); max-width:460px; margin:0 auto; user-select:none; -webkit-user-select:none; }
  button { font-family:inherit; cursor:pointer; touch-action:manipulation; }
  [hidden] { display:none !important; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));
          display:grid; place-items:center; flex:none; }
  h1 { font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0; }
  #now { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 0; min-width:0; text-align:right; }
  .dot { width:9px; height:9px; border-radius:50%; background:#10b981; flex:none; }
  .dot.off { background:#ef4444; }

  .seg { display:flex; background:var(--card); border-radius:12px; padding:4px; gap:4px; margin-bottom:6px; }
  .seg button { flex:1; min-width:0; height:36px; border:0; border-radius:9px; background:none; color:var(--muted); font-size:14px; font-weight:700; }
  .seg button.on { background:var(--key2); color:var(--text); }

  .pad { position:relative; width:min(78vw,300px); aspect-ratio:1; margin:8px auto 18px; border-radius:50%;
         background:radial-gradient(circle at 50% 40%, var(--key2), var(--key)); box-shadow:0 10px 30px #0008, inset 0 1px 0 #ffffff14; }
  .pad button { position:absolute; background:none; border:0; color:var(--text); font-size:26px; display:grid; place-items:center; }
  .pad .up    { top:0; left:30%; width:40%; height:30%; }
  .pad .down  { bottom:0; left:30%; width:40%; height:30%; }
  .pad .left  { left:0; top:30%; width:30%; height:40%; }
  .pad .right { right:0; top:30%; width:30%; height:40%; }
  .pad .ok    { left:31%; top:31%; width:38%; height:38%; border-radius:50%;
                background:linear-gradient(135deg,var(--accent1),var(--accent2)); font-size:18px; font-weight:800; box-shadow:0 4px 18px #db277766; }
  .pad button:active, .row button:active, .tile:active, .np-row button:active { transform:scale(.94); filter:brightness(1.25); }

  .touch { position:relative; height:min(78vw,320px); margin:8px 0 18px; border-radius:22px; touch-action:none; cursor:crosshair;
           background:radial-gradient(circle at 50% 35%, var(--key2), var(--key)); box-shadow:0 10px 30px #0008, inset 0 1px 0 #ffffff14;
           display:flex; align-items:flex-end; justify-content:center; padding:14px; }
  .touch.active { filter:brightness(1.12); }
  .touch span { color:var(--muted); font-size:12px; text-align:center; pointer-events:none; }

  .row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:10px; }
  .row.media, .row.vol { grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .row button, .np-row button { min-width:0; padding:0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ic { width:22px; height:22px; fill:currentColor; flex:none; }
  .row button { display:flex; align-items:center; justify-content:center; gap:6px; }
  .row button span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .row button { height:54px; border-radius:14px; border:0; background:var(--key); color:var(--text); font-size:15px; font-weight:600; }
  .row.media button { font-size:19px; }
  .row.vol button { font-size:14px; }

  .card { background:var(--card); border-radius:16px; padding:12px; margin-top:12px; }
  .card label, .card .label { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; display:block; margin:2px 2px 8px; }
  #homeLists .label { margin-top:16px; }
  .field { display:flex; gap:8px; min-width:0; }
  .field input { flex:1; min-width:0; height:46px; border-radius:12px; border:1px solid #ffffff1a; background:#120f19; color:var(--text);
                 padding:0 12px; font-size:16px; user-select:text; -webkit-user-select:text; }
  .field button { flex:none; height:46px; padding:0 14px; border-radius:12px; border:0; color:white; font-weight:700; font-size:15px;
                  background:linear-gradient(135deg,var(--accent1),var(--accent2)); white-space:nowrap; }
  .field button { display:flex; align-items:center; justify-content:center; gap:6px; }
  .field button .ic { width:24px; height:24px; }
  .field button.plain { background:var(--key); color:var(--muted); padding:0 12px; }
  .sub { color:var(--muted); font-size:12px; margin:8px 2px 0; }

  .np-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0 2px 8px; }
  .np-seek { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .np-seek input { flex:1; min-width:0; accent-color:var(--accent2); height:28px; }
  .np-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:8px; }
  .np-row button { height:46px; border-radius:12px; border:0; background:var(--key); color:var(--text); font-size:16px; font-weight:700; }
  .np-row button.on { background:linear-gradient(135deg,var(--accent1),var(--accent2)); }
  .np-row button { display:flex; align-items:center; justify-content:center; gap:6px; }
  .np-row button span { min-width:0; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .np-row.np-chips { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .np-row.np-menu button { flex-direction:column; gap:2px; height:52px; font-size:12px; font-weight:600; }
  .np-row.np-menu .ic { width:20px; height:20px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(66px,100%),1fr)); gap:8px; margin-bottom:10px; }
  .tile { border:0; background:var(--key); border-radius:14px; padding:10px 4px 8px; color:var(--text); display:flex; flex-direction:column;
          align-items:center; gap:6px; min-width:0; }
  .tile .ic { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; overflow:hidden; }
  .tile .ic img { width:30px; height:30px; object-fit:contain; }
  .tile .nm { font-size:11px; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; text-align:center; margin-top:16px; }
  .main, .controls, .side, .card { min-width:0; }

  /* Small phones (360 px): tighter gutters so five-key rows and the text field keep their labels. */
  @media (max-width:380px) {
    body { padding-left:12px; padding-right:12px; }
    .row.media, .row.vol, .np-row { gap:6px; }
    .row.vol button { font-size:13px; }
    .field button { padding:0 10px; }
  }

  /* Landscape phones, tablets and desktop browsers: controls on the left, the rest on the right. */
  @media (orientation:landscape) and (min-width:560px), (min-width:760px) {
    body { max-width:1040px; }
    .main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; }
    .side .card:first-child { margin-top:0; }
    .pad { width:min(40vw,300px,60vh); }
    .touch { height:min(60vh,340px); }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 5.2v13.6l11-6.8z" fill="#fff" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/><text x="10.6" y="13.9" text-anchor="middle" font-size="5.6" font-weight="800" font-family="system-ui,sans-serif" fill="#db2777">mk</text></svg></div>
  <h1>mkTV Remote</h1>
  <span id="now"></span>
  <span class="dot" id="dot"></span>
</header>

<div class="main">
<div class="controls">
  <div class="seg" role="tablist">
    <button id="vButtons" role="tab">Buttons</button>
    <button id="vTouch" role="tab">Touchpad</button>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-key="up" aria-label="Up">▲</button>
    <button class="left" data-key="left" aria-label="Left">◀</button>
    <button class="ok" data-key="ok" aria-label="OK">OK</button>
    <button class="right" data-key="right" aria-label="Right">▶</button>
    <button class="down" data-key="down" aria-label="Down">▼</button>
  </div>
  <div class="touch" id="touch" hidden><span id="touchHint"></span></div>

  <div class="row">
    <button data-key="back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/></svg><span>Back</span></button>
    <button data-key="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/></svg><span>Home</span></button>
    <button data-key="menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/></svg><span>Menu</span></button>
  </div>
  <div class="row media">
    <button data-key="prev" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6,6h2v12H6zM9.5,12l8.5,6V6z"/></svg></button>
    <button data-key="rew" aria-label="Back 10 seconds"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11,18V6l-8.5,6 8.5,6zM11.5,12l8.5,6V6l-8.5,6z"/></svg></button>
    <button data-key="playpause" aria-label="Play or pause"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3,5v14l9,-7zM14,5h3v14h-3zM19,5h3v14h-3z"/></svg></button>
    <button data-key="ff" aria-label="Forward 10 seconds"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4,18l8.5,-6L4,6v12zM13,6v12l8.5,-6L13,6z"/></svg></button>
    <button data-key="next" aria-label="Next"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/></svg></button>
  </div>
  <div class="row vol">
    <button data-key="voldown" aria-label="Volume down"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05c1.48,-0.73 2.5,-2.25 2.5,-4.02zM5,9v6h4l5,5V4L9,9H5z"/></svg></button>
    <button data-key="mute" aria-label="Mute"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v2.21l2.45,2.45c0.03,-0.2 0.05,-0.41 0.05,-0.63zM19,12c0,0.94 -0.2,1.82 -0.54,2.64l1.51,1.51C20.63,14.91 21,13.5 21,12c0,-4.28 -2.99,-7.86 -7,-8.77v2.06c2.89,0.86 5,3.54 5,6.71zM4.27,3L3,4.27 7.73,9H3v6h4l5,5v-6.73l4.25,4.25c-0.67,0.52 -1.42,0.93 -2.25,1.18v2.06c1.38,-0.31 2.63,-0.95 3.69,-1.81L19.73,21 21,19.73l-9,-9L4.27,3zM12,4L9.91,6.09 12,8.18V4z"/></svg></button>
    <button data-key="volup" aria-label="Volume up"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3,9v6h4l5,5V4L7,9H3zM16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05c1.48,-0.73 2.5,-2.25 2.5,-4.02zM14,3.23v2.06c2.89,0.86 5,3.54 5,6.71s-2.11,5.85 -5,6.71v2.06c4.01,-0.91 7,-4.49 7,-8.77s-2.99,-7.86 -7,-8.77z"/></svg></button>
    <button data-key="pageup" aria-label="Page up"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6 -6,6z"/></svg><span>Page</span></button>
    <button data-key="pagedown" aria-label="Page down"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z"/></svg><span>Page</span></button>
  </div>
</div>

<div class="side">
  <div class="card" id="np" hidden>
    <div class="label">Now playing</div>
    <div class="np-title" id="npTitle"></div>
    <div class="np-seek" id="npSeek">
      <span id="npT">0:00</span>
      <input id="npBar" type="range" min="0" max="1" step="1" value="0" aria-label="Seek">
      <span id="npD">0:00</span>
    </div>
    <div class="np-row">
      <button data-key="rew" aria-label="Back 10 seconds">−10</button>
      <button data-key="playpause" id="npPlay" aria-label="Play or pause"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8,5v14l11,-7z"/></svg></button>
      <button data-key="ff" aria-label="Forward 10 seconds">+10</button>
      <button id="npFull" aria-label="Full screen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7,14H5v5h5v-2H7v-3zM5,10h2V7h3V5H5v5zM17,17h-3v2h5v-5h-2v3zM14,5v2h3v3h2V5h-5z"/></svg></button>
      <button id="npCc" aria-label="Captions">CC</button>
    </div>
    <div class="np-row np-chips">
      <button id="npSpeed" aria-label="Playback speed: tap for the next speed"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.38,8.57l-1.23,1.85a8,8 0,0 1,-0.22 7.58H5.07A8,8 0,0 1,15.58 6.85l1.85,-1.23A10,10 0,0 0,3.35 19a2,2 0,0 0,1.72 1h13.85a2,2 0,0 0,1.74 -1a10,10 0,0 0,-0.27 -10.44zM10.59,15.41a2,2 0,0 0,2.83 0l5.66,-8.49 -8.49,5.66a2,2 0,0 0,0 2.83z"/></svg><span id="npSpeedT">1×</span></button>
      <button id="npSleep" aria-label="Sleep timer" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.34,2.02C6.59,1.82 2,6.42 2,12c0,5.52 4.48,10 10,10c3.71,0 6.93,-2.02 8.66,-5.02C13.15,16.73 8.57,8.55 12.34,2.02z"/></svg><span id="npSleepT">Sleep</span></button>
    </div>
    <div class="np-row np-menu" id="npSleepMenu" hidden>
      <button data-sleep="0" aria-label="Sleep timer off"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></svg><span>Off</span></button>
      <button data-sleep="15" aria-label="Sleep in 15 minutes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15,1H9v2h6V1zM11,14h2V8h-2v6zM19.03,7.39l1.42,-1.42c-0.43,-0.51 -0.9,-0.99 -1.41,-1.41l-1.42,1.42C16.07,4.74 14.12,4 12,4c-4.97,0 -9,4.03 -9,9s4.02,9 9,9 9,-4.03 9,-9c0,-2.12 -0.74,-4.07 -1.97,-5.61zM12,20c-3.87,0 -7,-3.13 -7,-7s3.13,-7 7,-7 7,3.13 7,7 -3.13,7 -7,7z"/></svg><span>15m</span></button>
      <button data-sleep="30" aria-label="Sleep in 30 minutes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15,1H9v2h6V1zM11,14h2V8h-2v6zM19.03,7.39l1.42,-1.42c-0.43,-0.51 -0.9,-0.99 -1.41,-1.41l-1.42,1.42C16.07,4.74 14.12,4 12,4c-4.97,0 -9,4.03 -9,9s4.02,9 9,9 9,-4.03 9,-9c0,-2.12 -0.74,-4.07 -1.97,-5.61zM12,20c-3.87,0 -7,-3.13 -7,-7s3.13,-7 7,-7 7,3.13 7,7 -3.13,7 -7,7z"/></svg><span>30m</span></button>
      <button data-sleep="60" aria-label="Sleep in 60 minutes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15,1H9v2h6V1zM11,14h2V8h-2v6zM19.03,7.39l1.42,-1.42c-0.43,-0.51 -0.9,-0.99 -1.41,-1.41l-1.42,1.42C16.07,4.74 14.12,4 12,4c-4.97,0 -9,4.03 -9,9s4.02,9 9,9 9,-4.03 9,-9c0,-2.12 -0.74,-4.07 -1.97,-5.61zM12,20c-3.87,0 -7,-3.13 -7,-7s3.13,-7 7,-7 7,3.13 7,7 -3.13,7 -7,7z"/></svg><span>60m</span></button>
      <button data-sleep="-1" aria-label="Pause at the end of this video"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/></svg><span>End</span></button>
    </div>
  </div>

  <div class="card">
    <label for="text">Type on TV</label>
    <div class="field">
      <input id="text" placeholder="Type into the selected box" autocomplete="off" enterkeyhint="send">
      <button id="clear" class="plain" aria-label="Clear the TV box"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></svg></button>
      <button id="enter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19,7v4H5.83l3.58,-3.59L8,6l-6,6 6,6 1.41,-1.41L5.83,13H21V7z"/></svg><span>Enter</span></button>
    </div>
  </div>

  <div class="card" id="home">
    <label for="url">Search or open a site on TV</label>
    <div class="field">
      <input id="url" type="text" inputmode="search" placeholder="e.g. cooking videos or youtube.com" autocomplete="off" autocapitalize="off" enterkeyhint="go">
      <button id="open"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12,4l-1.41,1.41L16.17,11H4v2h12.17l-5.58,5.59L12,20l8,-8z"/></svg><span>Go</span></button>
    </div>
    <div id="homeLists"></div>
  </div>
</div>
</div>
<p class="hint">Hold an arrow to keep moving. Phone and TV must be on the same Wi-Fi.</p>

<script>
  var ICON_PLAY = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8,5v14l11,-7z"/></svg>', ICON_PAUSE = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/></svg>';
  var token = new URLSearchParams(location.search).get('t') || '';
  function $(id) { return document.getElementById(id); }
  function api(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': token }, body: JSON.stringify(body || {}) })
      .then(function (r) { setOnline(r.ok); return r; })
      .catch(function () { setOnline(false); });
  }
  function getJson(path) {
    return fetch(path, { headers: { 'X-Token': token } })
      .then(function (r) { setOnline(r.ok); return r.json(); });
  }
  function setOnline(ok) { $('dot').className = ok ? 'dot' : 'dot off'; }
  function buzz() { if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {} }
  // Keys that can open or close an overlay re-check soon whether touchpad drags move the pointer.
  var CHANGES_VIEW = { ok: 1, back: 1, home: 1, menu: 1 };
  function press(key) { api('/api/key', { key: key, action: 'press' }); if (CHANGES_VIEW[key]) setTimeout(poll, 400); }
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // Arrows support holding (down/up events) so "hold ▼" shortcuts and fast scrolling work; other keys are a press.
  var HOLDABLE = { up: 1, down: 1, left: 1, right: 1, ok: 1, back: 1 };
  document.querySelectorAll('[data-key]').forEach(function (b) {
    var key = b.getAttribute('data-key'), held = false;
    if (HOLDABLE[key]) {
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); held = true; buzz(); api('/api/key', { key: key, action: 'down' }); });
      var release = function () { if (!held) return; held = false; api('/api/key', { key: key, action: 'up' }); if (CHANGES_VIEW[key]) setTimeout(poll, 400); };
      b.addEventListener('pointerup', release); b.addEventListener('pointerleave', release); b.addEventListener('pointercancel', release);
    } else {
      b.addEventListener('click', function () {
        buzz(); press(key);
        if (key === 'home') setTimeout(loadHome, 800);
        if (key === 'playpause' || key === 'ff' || key === 'rew') setTimeout(poll, 300);
      });
    }
  });

  // ---- Buttons / Touchpad ----
  function setView(v) {
    $('pad').hidden = v === 'touch'; $('touch').hidden = v !== 'touch';
    $('vButtons').className = v === 'touch' ? '' : 'on'; $('vTouch').className = v === 'touch' ? 'on' : '';
    store.set('mk.view', v);
  }
  $('vButtons').onclick = function () { setView('buttons'); };
  $('vTouch').onclick = function () { setView('touch'); };
  setView(store.get('mk.view') === 'touch' ? 'touch' : 'buttons');

  // Swipe = one arrow per STEP px (axis locked per gesture), tap = OK, two-finger tap or long-press = Back.
  // In pointer mode (state.pointer) a drag moves the TV's pointer instead.
  var STEP = 60, pointer = false;
  (function () {
    var el = $('touch'), pts = {}, count = 0, most = 0, moved = false, longFired = false, longT = null;
    var sx, sy, ax, ay, lx, ly, lt, axis = null, steps = 0, mx = 0, my = 0, sending = false;
    function flushMove() {
      if (sending || (!mx && !my)) return;
      sending = true;
      var dx = Math.round(mx * 10) / 10, dy = Math.round(my * 10) / 10; mx = 0; my = 0;
      api('/api/move', { dx: dx, dy: dy }).then(function () { sending = false; setTimeout(flushMove, 0); });
    }
    function hint() {
      $('touchHint').textContent = pointer ? 'Drag to move the pointer · tap to click · two-finger tap or long-press = Back'
        : 'Swipe to move · tap = OK · two-finger tap or long-press = Back';
    }
    hint(); el.hint = hint;
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      pts[e.pointerId] = { x: e.clientX, y: e.clientY }; count++; most = Math.max(most, count);
      el.className = 'touch active';
      if (count === 1) {
        sx = ax = lx = e.clientX; sy = ay = ly = e.clientY; lt = e.timeStamp;
        moved = false; longFired = false; axis = null; steps = 0;
        clearTimeout(longT);
        longT = setTimeout(function () { if (!moved && most === 1) { longFired = true; buzz(); press('back'); } }, 550);
      } else clearTimeout(longT);
    });
    el.addEventListener('pointermove', function (e) {
      var p = pts[e.pointerId]; if (!p) return;
      var x = e.clientX, y = e.clientY;
      if (!moved && Math.abs(x - p.x) + Math.abs(y - p.y) > 12) { moved = true; clearTimeout(longT); }
      if (most > 1 || !moved || longFired) return;
      if (pointer) {
        // Faster finger, further pointer: up to 2.5× like a laptop touchpad.
        var dt = Math.max(1, e.timeStamp - lt), dist = Math.abs(x - lx) + Math.abs(y - ly);
        var f = 1 + Math.min(1.5, dist / dt * 0.6);
        mx += (x - lx) * f; my += (y - ly) * f; flushMove();
      } else {
        var dx = x - ax, dy = y - ay;
        if (!axis && (Math.abs(dx) >= STEP || Math.abs(dy) >= STEP)) axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
        while (axis === 'x' && Math.abs(dx) >= STEP) { press(dx > 0 ? 'right' : 'left'); buzz(); steps++; ax += dx > 0 ? STEP : -STEP; dx = x - ax; }
        while (axis === 'y' && Math.abs(dy) >= STEP) { press(dy > 0 ? 'down' : 'up'); buzz(); steps++; ay += dy > 0 ? STEP : -STEP; dy = y - ay; }
      }
      lx = x; ly = y; lt = e.timeStamp;
    });
    function end(e) {
      if (!pts[e.pointerId]) return;
      delete pts[e.pointerId]; count--;
      if (count > 0) return;
      clearTimeout(longT);
      el.className = 'touch';
      var g = most; most = 0;
      if (e.type === 'pointercancel' || longFired) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (g >= 2) { if (!moved) { buzz(); press('back'); } return; }
      if (!moved) { buzz(); press('ok'); return; }
      // A short flick that never reached STEP still counts as one arrow.
      if (!pointer && steps === 0 && Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
        buzz(); press(Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      }
    }
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  })();

  // ---- Live typing: sends only what changed (Backspaces + new text), one request at a time so order holds. ----
  (function () {
    var box = $('text'), sent = '', busy = false, again = false, wantEnter = false, wantClear = false, timer = null;
    function flush() {
      clearTimeout(timer);
      if (busy) { again = true; return; }
      var v = box.value.slice(0, 1000), enter = wantEnter, clear = wantClear;
      wantEnter = false; wantClear = false;
      var p = 0;
      while (p < v.length && p < sent.length && v.charAt(p) === sent.charAt(p)) p++;
      var del = clear ? sent.length : sent.length - p, add = clear ? '' : v.slice(p);
      if (!del && !add && !enter && !clear) return;
      busy = true;
      api('/api/text', { text: add, del: del, clear: clear, enter: enter }).then(function (r) {
        busy = false;
        if (r && r.ok) {
          sent = clear ? '' : v;
          // After Enter the TV field has been submitted: start fresh, unless more was typed meanwhile.
          if (enter) { sent = ''; if (box.value === v) box.value = ''; }
        }
        if (again) { again = false; flush(); }
      });
    }
    box.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(flush, 150); });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); wantEnter = true; buzz(); flush(); }
      else if (e.key === 'Escape') box.blur();
    });
    $('enter').onclick = function () { wantEnter = true; buzz(); flush(); };
    $('clear').onclick = function () { box.value = ''; wantClear = true; buzz(); flush(); };
  })();

  // ---- Home lists (Popular, Favourites, Recent) as tiles; tap opens on the TV ----
  function openUrl(u) { api('/api/open', { url: u }); buzz(); setTimeout(poll, 600); setTimeout(loadHome, 2000); }
  function tile(it) {
    var b = document.createElement('button'), ic = document.createElement('span'), nm = document.createElement('span');
    b.className = 'tile'; ic.className = 'ic'; nm.className = 'nm';
    nm.textContent = it.title || it.url;
    function letter() { ic.textContent = it.letter || '?'; ic.style.background = it.color || '#6366F1'; }
    if (it.icon) {
      // The TV's own saved favicon: the phone never fetches icons from the sites themselves.
      var img = new Image();
      img.alt = '';
      img.onerror = function () { img.remove(); letter(); };
      img.src = '/api/icon?t=' + encodeURIComponent(token) + '&h=' + encodeURIComponent(it.icon);
      ic.style.background = '#fff'; ic.appendChild(img);
    } else letter();
    b.appendChild(ic); b.appendChild(nm);
    b.onclick = function () { openUrl(it.url); };
    return b;
  }
  function loadHome() {
    getJson('/api/home').then(function (h) {
      var box = $('homeLists'); box.textContent = '';
      [['popular', 'Popular'], ['favourites', 'Favourites'], ['recent', 'Recently visited']].forEach(function (s) {
        var list = h[s[0]] || [];
        if (!list.length) return;
        var l = document.createElement('div'); l.className = 'label'; l.textContent = s[1];
        var g = document.createElement('div'); g.className = 'tiles';
        list.forEach(function (it) { g.appendChild(tile(it)); });
        box.appendChild(l); box.appendChild(g);
      });
    }).catch(function () { setOnline(false); });
  }
  function openTyped() {
    var el = $('url');
    if (!el.value) return;
    openUrl(el.value); el.value = ''; el.blur();
  }
  $('open').onclick = openTyped;
  $('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); openTyped(); } });

  // ---- Now playing ----
  var media = null, mediaAt = 0, dragging = false;
  function fmt(s) {
    s = Math.max(0, Math.floor(s)); var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }
  function renderMedia(m, title) {
    media = m; mediaAt = Date.now();
    $('np').hidden = !m;
    if (!m) return;
    $('npTitle').textContent = title || '';
    $('npSeek').hidden = !(m.d > 0);
    $('npPlay').innerHTML = m.playing ? ICON_PAUSE : ICON_PLAY;
    $('npCc').hidden = !m.cc; $('npCc').className = m.ccOn ? 'on' : '';
    $('npFull').className = m.fs ? 'on' : '';
    if (m.d > 0) { $('npBar').max = Math.floor(m.d); $('npD').textContent = fmt(m.d); }
    renderSpeed();
    tick();
  }
  // ---- Speed chip (cycles) and sleep timer chip (small menu); allowlists match RemoteInput on the TV ----
  var SPEEDS = [0.75, 1, 1.25, 1.5, 2], sleep = { mode: 0, left: 0 }, sleepAt = 0;
  function snapSpeed(s) {
    var best = 1;
    SPEEDS.forEach(function (v) { if (Math.abs(v - (s || 1)) < Math.abs(best - (s || 1))) best = v; });
    return best;
  }
  function renderSpeed() {
    var s = snapSpeed(media && media.speed);
    $('npSpeedT').textContent = s + '×';
    $('npSpeed').className = s !== 1 ? 'on' : '';
  }
  $('npSpeed').onclick = function () {
    if (!media) return;
    buzz();
    var next = SPEEDS[(SPEEDS.indexOf(snapSpeed(media.speed)) + 1) % SPEEDS.length];
    media.speed = next; renderSpeed();
    api('/api/media', { action: 'speed', value: next });
  };
  function renderSleep(s) {
    if (s) { sleep = s; sleepAt = Date.now(); }
    var left = Math.max(0, sleep.left - (Date.now() - sleepAt) / 1000), label = 'Sleep';
    if (sleep.mode === -1) label = 'End';
    else if (sleep.mode > 0) label = left >= 60 ? Math.ceil(left / 60) + ' min' : fmt(left);
    $('npSleepT').textContent = label;
    $('npSleep').className = sleep.mode ? 'on' : '';
    var opts = $('npSleepMenu').querySelectorAll('button');
    for (var i = 0; i < opts.length; i++) opts[i].className = +opts[i].getAttribute('data-sleep') === sleep.mode ? 'on' : '';
  }
  setInterval(function () { if (sleep.mode > 0) renderSleep(); }, 1000);
  function showSleepMenu(open) { $('npSleepMenu').hidden = !open; $('npSleep').setAttribute('aria-expanded', open ? 'true' : 'false'); }
  $('npSleep').onclick = function () { buzz(); showSleepMenu($('npSleepMenu').hidden); };
  $('npSleepMenu').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var m = +b.getAttribute('data-sleep');
    buzz(); showSleepMenu(false);
    renderSleep({ mode: m, left: m > 0 ? m * 60 : 0 });
    api('/api/media', { action: 'sleep', value: m });
  });
  function tick() {
    if (!media || !(media.d > 0) || dragging) return;
    var t = Math.min(media.d, media.t + (media.playing ? (Date.now() - mediaAt) / 1000 : 0));
    $('npBar').value = Math.floor(t); $('npT').textContent = fmt(t);
  }
  setInterval(tick, 250);
  $('npBar').addEventListener('input', function () { dragging = true; $('npT').textContent = fmt(+this.value); });
  $('npBar').addEventListener('change', function () {
    var t = +this.value; dragging = false;
    if (media) { media.t = t; mediaAt = Date.now(); }
    api('/api/media', { action: 'seek', to: t }); buzz();
  });
  $('npFull').onclick = function () { buzz(); api('/api/media', { action: 'fullscreen' }); setTimeout(poll, 600); };
  $('npCc').onclick = function () { buzz(); api('/api/media', { action: 'captions' }); setTimeout(poll, 300); };

  // ---- Keyboard, when used from a computer ----
  var KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok' }, down = {};
  document.addEventListener('keydown', function (e) {
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = KEYMAP[e.key];
    if (k) { e.preventDefault(); if (!down[k]) { down[k] = 1; api('/api/key', { key: k, action: 'down' }); } }
    else if (e.key === 'Backspace' || e.key === 'Escape') { e.preventDefault(); if (!e.repeat) press('back'); }
  });
  document.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.key];
    if (k && down[k]) { delete down[k]; api('/api/key', { key: k, action: 'up' }); }
  });
  window.addEventListener('blur', function () { Object.keys(down).forEach(function (k) { api('/api/key', { key: k, action: 'up' }); }); down = {}; });

  // ---- State: title, pointer mode, video. Faster while a video plays; paused while this tab is hidden. ----
  var pollTimer = null, pollGen = 0;
  function poll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    var gen = ++pollGen;
    getJson('/api/state').then(function (s) {
      $('now').textContent = s.title || '';
      if (pointer !== !!s.pointer) { pointer = !!s.pointer; $('touch').hint(); }
      renderMedia(s.media || null, s.title);
      if (s.sleep) renderSleep(s.sleep);
    }).catch(function () { setOnline(false); }).then(function () {
      if (gen === pollGen) pollTimer = setTimeout(poll, media ? 1000 : 2500);
    });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); loadHome(); } });
  poll(); loadHome();
</script>
</body>
</html>
